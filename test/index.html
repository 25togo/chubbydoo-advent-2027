<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>跨年倒數小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 版面：雪夜裡的 chubby doo 小屋（北歐童話風屋頂＋花環），正面 17 扇木窗板＋1/1 大門，一天推開一扇 */
:root{
  --sky:#1d2b4f;--sky-2:#2f4373;
  --wall:#a8734e;--wall-dark:#8a5a3a;
  --icing:#fff8ec;--glow:#f8da89;
  --red:#c94a3a;--red-dark:#9e3528;
  --green:#3d7a5a;--green-dark:#2a5a41;
  --ink:#3b2416;--paper:#fffaf0;--muted:#7b6a5c;
  --f-num:"Dela Gothic One","Zen Maru Gothic",system-ui,sans-serif;
  --f-body:"Zen Maru Gothic","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--paper);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.bg{position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 0%,var(--sky-2),var(--sky) 70%);z-index:-1}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:18px}

header{text-align:center;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:13px;letter-spacing:.2em;color:var(--glow);font-weight:700}
h1{font-family:var(--f-body);font-weight:900;font-size:clamp(30px,8.6vw,42px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.08em;text-shadow:0 3px 0 #a8734e}
.sub{margin:0;font-size:15px;color:#d9e0f2}
.note{margin:4px 0 0;font-size:14px;font-weight:900;color:var(--ink);background:var(--glow);border-radius:999px;padding:5px 14px}

.sim{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.3);border-radius:10px;padding:8px 12px;font-size:13px;color:#d9e0f2}
.sim select,.sim button{font:inherit;background:var(--sky);color:var(--paper);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:3px 8px;cursor:pointer}

/* ── 小屋 ── */
.house{width:min(100%,440px);display:flex;flex-direction:column;align-items:center}
.roof{display:block;width:100%;height:auto;position:relative;z-index:2}
.puff{transform-box:fill-box;transform-origin:center;opacity:0;animation:puff 4.8s linear infinite}
.puff:nth-child(2){animation-delay:1.2s}.puff:nth-child(3){animation-delay:2.4s}.puff:nth-child(4){animation-delay:3.6s}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:0}12%{opacity:.9}50%{transform:translate(9px,-30px) scale(1.1);opacity:.7}100%{transform:translate(-4px,-50px) scale(1.6);opacity:0}}
.roof{overflow:visible}
.facade{width:90.9%;margin-top:-2px;background:var(--wall);background-image:repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.07) 26px 28px);position:relative}
.garland{display:block;width:100%;height:auto;margin-top:3px;margin-bottom:-4px;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px 8px;padding:0 10px 0}
.ground{width:100%;height:24px;background:var(--icing);border-radius:0 0 50% 50%/0 0 100% 100%;position:relative;z-index:2}

.win{position:relative;width:100%;padding:0;border:none;background:none;font:inherit;color:inherit;cursor:default;display:block}
.win svg{display:block;width:100%;height:auto;overflow:visible}
.win:focus-visible{outline:3px solid var(--glow);outline-offset:2px;border-radius:8px}
.win.today,.win.open,.win.missed,.win.future{cursor:pointer}
.win.today::before{content:"今天";position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:6;background:var(--glow);color:var(--ink);font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.halo{opacity:0}
.win.today .halo{opacity:1;animation:halo 1.6s ease-in-out infinite}
@keyframes halo{50%{opacity:.45}}
/* 開過的窗：燈光呼吸＋小星星閃 */
.flick,.spark{opacity:0}
.win.open .flick{animation:flick 2.4s ease-in-out infinite}
.win.open .spark{animation:spark 3s ease-in-out infinite}
.win.open .halo{opacity:.5;animation:halo2 2.4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.15}50%{opacity:.75}}
@keyframes spark{0%,100%{opacity:0}40%,60%{opacity:1}}
@keyframes halo2{50%{opacity:.25}}
/* 金幣：轉圈＋跳 */
.coin-hop{animation:coinHop 1.6s ease-in-out infinite}
.coin-spin{transform-box:view-box;transform-origin:30px 20px;transform-origin:center;animation:coinSpin 1.6s ease-in-out infinite}
.coin-tw{transform-box:fill-box;transform-origin:center;animation:fw 1.4s ease-out infinite}
@keyframes coinHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
@keyframes coinSpin{0%,50%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(.12)}}
.coin-edge{transform-box:fill-box;transform-origin:center;animation:coinEdge 1.6s ease-in-out infinite}
@keyframes coinEdge{0%,50%,100%{transform:scaleX(.2);opacity:0}25%,75%{transform:scaleX(1);opacity:1}}
/* 甜甜圈彈彈 */
.dn-bob{transform-box:fill-box;transform-origin:50% 100%;animation:dnBob 1.3s ease-in-out infinite}
@keyframes dnBob{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-4px) scale(.97,1.03)}70%{transform:translateY(0) scale(1.04,.96)}}
/* 可麗露花瓣慢慢轉 */
.petal-spin{transform-box:view-box;transform-origin:30px 24px;animation:petal 3.2s ease-in-out infinite}
@keyframes petal{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
/* 禮盒：晃＋蓋子跳＋星星冒 */
.gift-wig{transform-box:fill-box;transform-origin:50% 100%;animation:giftWig 1.6s ease-in-out infinite}
.gift-lid{animation:giftLid 1.6s ease-in-out infinite}
.gift-star{transform-box:fill-box;transform-origin:center;animation:giftStar 1.6s ease-out infinite}
@keyframes giftWig{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(-4deg)}40%{transform:rotate(0)}}
@keyframes giftLid{0%,40%,100%{transform:translateY(0)}55%{transform:translateY(-9px) rotate(-4deg)}75%{transform:translateY(0)}}
@keyframes giftStar{0%,42%{transform:translateY(4px) scale(.3);opacity:0}60%{transform:translateY(-12px) scale(1);opacity:1}85%{transform:translateY(-16px) scale(1);opacity:0}100%{opacity:0}}
/* 牡丹：呼吸輕擺 */
.peony-b{transform-box:fill-box;transform-origin:50% 70%;animation:peony 2.6s ease-in-out infinite}
@keyframes peony{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.07) rotate(4deg)}}
/* 花束：從底部搖 */
.bq-sway{transform-box:view-box;transform-origin:30px 56px;animation:bq 2s ease-in-out infinite}
@keyframes bq{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
/* 籤筒：搖一搖、籤冒出來 */
.tube-shake{transform-box:view-box;transform-origin:30px 56px;animation:tube 1.8s ease-in-out infinite}
.tube-stick{animation:stick 1.8s ease-in-out infinite}
@keyframes tube{0%,55%,100%{transform:rotate(0)}8%{transform:rotate(-9deg)}16%{transform:rotate(9deg)}24%{transform:rotate(-7deg)}32%{transform:rotate(6deg)}40%{transform:rotate(0)}}
@keyframes stick{0%,40%{transform:translateY(10px)}55%,80%{transform:translateY(-13px)}100%{transform:translateY(10px)}}
/* 屋簷小精靈 */
.eave-walk{animation:eaveWalk 16s linear infinite}
.eave-flip{transform-box:fill-box;transform-origin:center;animation:elfFlip 16s steps(1) infinite}
.eave-trip{transform-box:fill-box;transform-origin:50% 100%;animation:eaveTrip 16s ease-in-out infinite}
@keyframes eaveWalk{0%{transform:translateX(0)}20%,26%{transform:translateX(120px)}46%,50%{transform:translateX(290px)}70%,76%{transform:translateX(170px)}96%,100%{transform:translateX(0)}}
@keyframes eaveTrip{0%,20%{transform:rotate(0)}21.5%{transform:translateY(-6px) rotate(-25deg)}23%{transform:translateY(2px) rotate(-95deg)}24.5%{transform:rotate(-95deg)}26%{transform:rotate(0)}
  70%{transform:rotate(0)}72%{transform:translateY(-22px) rotate(-180deg)}74%{transform:translateY(-10px) rotate(-360deg)}76%,100%{transform:translateY(0) rotate(-360deg)}}
.hang-swing{transform-origin:0 0;animation:hang 2.4s ease-in-out infinite}
@keyframes hang{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
.hang .wave{display:none}
.hang .leg{animation-duration:.22s!important}
.sweat{animation:sweat 1.2s ease-in infinite}
@keyframes sweat{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-3px,8px);opacity:0}}
/* 煙火綻放 */
.fw{transform-box:fill-box;transform-origin:center;animation:fw 1.8s ease-out infinite}
@keyframes fw{0%{transform:scale(.2);opacity:0}25%{opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.12);opacity:0}}
/* 雪人揮手 */
.arm-l{transform-box:fill-box;transform-origin:100% 100%;animation:armL 1.1s ease-in-out infinite alternate}
.arm-r{transform-box:fill-box;transform-origin:0 100%;animation:armR 1.1s ease-in-out infinite alternate-reverse}
@keyframes armL{from{transform:rotate(-12deg)}to{transform:rotate(22deg)}}
@keyframes armR{from{transform:rotate(12deg)}to{transform:rotate(-22deg)}}
/* 小精靈：左右走、到邊轉身、走路一跳一跳 */
.elf-walk{animation:elfWalk 7s ease-in-out infinite}
.elf-flip{transform-box:fill-box;transform-origin:center;animation:elfFlip 7s steps(1) infinite}
.elf-bob{animation:elfBob .36s ease-in-out infinite alternate}
.elf-bob .leg{transform-box:fill-box;transform-origin:50% 0;animation:elfLeg .36s ease-in-out infinite alternate}
.elf-bob .leg.r{animation-direction:alternate-reverse}
.elf-bob .wave{transform-box:fill-box;transform-origin:0 100%;animation:elfWave .5s ease-in-out infinite alternate}
.win.open .elf-walk{display:none}
@keyframes elfWalk{0%,6%{transform:translateX(0)}44%,56%{transform:translateX(58px)}94%,100%{transform:translateX(0)}}
@keyframes elfFlip{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes elfBob{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
@keyframes elfLeg{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes elfWave{from{transform:rotate(-15deg)}to{transform:rotate(25deg)}}

/* 窗板 */
.sh{transition:transform .9s cubic-bezier(.3,1.35,.5,1)}
.sh.l{transform-origin:18px 60px}
.sh.r{transform-origin:82px 60px}
.door .sh.l{transform-origin:16px 60px}
.door .sh.r{transform-origin:84px 60px}
.win.open .sh{transform:scaleX(-.3)}
.sh .body{fill:var(--sc)}
.sh .line{fill:none;stroke:var(--sl);stroke-width:1.6}
.sh .heart{fill:var(--sl)}
.win{--sc:#7a5238;--sl:#5c3b27}
.win.today{--sc:var(--red);--sl:var(--red-dark)}
.win.missed{--sc:#8d8681;--sl:#6d6661}
.win.open{--sc:#b98a62;--sl:#8f6444}
.door,.door.future,.door.today{--sc:#e2b54a;--sl:#b8892a}
.door .lab-big,.door .lab-sm{fill:#5a3a12}
.door .lk rect{fill:#5a3a12}
.door .lk path{stroke:#5a3a12}
.door .knob{fill:#a8731a}
.label{transition:opacity .25s}
.win.open .label{opacity:0}
.lab-big{font-family:var(--f-num);fill:var(--icing)}
.lab-sm{font-family:var(--f-body);font-weight:900;fill:var(--icing)}
.inside-txt{font-family:var(--f-body);font-weight:900;fill:var(--ink)}
.inside-txt .n{font-family:var(--f-body);font-weight:900}
.lab-big{stroke:var(--sc);stroke-width:.7px}
.inside-sm{font-family:var(--f-body);font-weight:900;fill:var(--red-dark)}

.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;font-size:12px;color:#d9e0f2}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rules{width:100%;background:rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.75;color:#d9e0f2}
.rules h2{font-size:14px;margin:0 0 4px;color:var(--glow)}
.rules ul{margin:0;padding-left:1.2em}

/* ── 卡片 ── */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:20;opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet-bg.show{opacity:1}
.sheet{width:min(100%,440px);background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,1.2,.4,1);display:flex;flex-direction:column;gap:12px;position:relative}
.sheet-bg.show .sheet{transform:none}
.x{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;border:none;background:#f1e7d6;color:var(--ink);font-size:18px;cursor:pointer}
.s-head{display:flex;align-items:center;gap:14px}
.s-pic{width:76px;flex:none;border-radius:14px;background:radial-gradient(circle at 50% 45%,#fff3c9,var(--glow) 70%);padding:6px}
.s-pic svg{display:block;width:100%;height:auto}
.s-date{font-size:13px;font-weight:700;color:var(--red)}
.s-title{font-family:var(--f-body);font-weight:900;font-size:22px;line-height:1.35;margin:2px 0 0;text-wrap:balance;letter-spacing:.03em}
.s-desc{margin:0;font-size:14px;line-height:1.7;color:#5b4636}
.code{border:2px dashed var(--wall);border-radius:12px;padding:10px 14px;background:#fff}
.code b{font-family:var(--f-num);font-weight:400;font-size:22px;letter-spacing:.08em;color:var(--wall-dark)}
.code small{font-size:11px;color:var(--muted)}
.cta{display:block;text-align:center;text-decoration:none;background:var(--red);color:#fff;font-weight:900;font-size:16px;padding:14px;border-radius:999px;border:none;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 var(--red-dark)}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-dark)}
.fine{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 看不到的窗暫停動畫，手機比較順 */
.win.off *{animation-play-state:paused!important}
</style>

</head><body>

  <circle cx="10" cy="-17.5" r="5.6" fill="#f5d0b0"/>
  <circle cx="12" cy="-18" r=".9" fill="#3b2416"/><circle cx="8.4" cy="-18" r=".9" fill="#3b2416"/>
  <circle cx="13.4" cy="-16" r="1.2" fill="#f7a3b5"/><circle cx="7" cy="-16" r="1.2" fill="#f7a3b5"/>
  <path d="M9 -15.4q1.2 1 2.4 0" stroke="#3b2416" stroke-width=".6" fill="none" stroke-linecap="round"/>
  ${hat}
</g></g></g></g></g>`};
function winSVG(d,k,st,i){
  const c=C[k],door=d==='2027-01-01';
  // 開口：窗＝上半圓＋直邊；門＝更高
  const L=door?16:18,R=door?84:82,TOP=door?12:12,BOT=door?140:112,rad=(R-L)/2,sy=TOP+rad,mid=50;
  const O=`M${L} ${BOT}V${sy}A${rad} ${rad} 0 0 1 ${R} ${sy}V${BOT}Z`;
  const F=`M${L-7} ${BOT+(door?0:4)}V${sy}A${rad+7} ${rad+7} 0 0 1 ${R+7} ${sy}V${BOT+(door?0:4)}Z`;
  const SL=`M${L} ${BOT}V${sy}A${rad} ${rad} 0 0 1 ${mid} ${TOP}V${BOT}Z`;
  const SR=`M${mid} ${TOP}A${rad} ${rad} 0 0 1 ${R} ${sy}V${BOT}H${mid}Z`;
  // 窗板上的雕花：內框線＋愛心
  const pnl=(x1,x2)=>`<path class="line" d="M${x1} ${BOT-8}V${sy+4}M${x2} ${BOT-8}V${sy+4}M${x1} ${BOT-8}H${x2}"/>`;
  const heart=x=>`<path class="heart" d="M${x} ${sy+4}c-2-3-6-1-4 2l4 4 4-4c2-3-2-5-4-2z"/>`;
  const panels=pnl(L+5,mid-5)+pnl(mid+5,R-5)+heart((L+mid)/2)+heart((mid+R)/2);
  const knob=door?`<circle class="knob" cx="${mid-6}" cy="100" r="3"/><circle class="knob" cx="${mid+6}" cy="100" r="3"/>`:`<circle cx="${mid-3}" cy="${sy+30}" r="1.8" fill="var(--sl)"/><circle cx="${mid+3}" cy="${sy+30}" r="1.8" fill="var(--sl)"/>`;
  const sub={today:'推開',missed:'錯過了',future:'',open:''}[st];
  const ly=door?82:70;
  const label=`<g class="label"><text class="lab-big" x="50" y="${ly}" text-anchor="middle" font-size="${door?17:15}">${md(d)}</text>${sub?`<text class="lab-sm" x="50" y="${ly+14}" text-anchor="middle" font-size="9">${sub}</text>`:''}${st==='future'?`<g transform="translate(0 ${door?10:-2})">${LOCK}</g>`:''}</g>`;
  const wreath=door?`<g class="label"><path d="M50 30L41 44M50 30l9 14" stroke="#a8731a" stroke-width="1.2" fill="none"/><circle cx="50" cy="30" r="2" fill="#a8731a"/><circle cx="50" cy="55" r="14" fill="#d9372b" stroke="#f6c94c" stroke-width="2.6"/><circle cx="50" cy="55" r="10.5" fill="none" stroke="#f6c94c" stroke-width=".8" stroke-dasharray="1.6 1.6"/><text x="50" y="58.6" text-anchor="middle" font-family="Dela Gothic One,sans-serif" font-size="7.6" fill="#fff8ec">2027</text><path d="M36 42l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1zM65 64l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8z" fill="#fff8ec"/></g>`:'';
  // 窗內：燈光＋窗簾＋插圖＋字
  const iy=door?30:24;
  const inside=`<g clip-path="url(#clip${i})"><rect x="0" y="0" width="100" height="150" fill="url(#gGlow)"/><rect class="flick" style="animation-delay:-${(i*0.37)%2.4}s" x="0" y="0" width="100" height="150" fill="url(#gFlick)"/>
    <path d="M${L} ${TOP}H${L+14}Q${L+8} ${sy+20} ${L+12} ${sy+30}Q${L+4} ${sy+34} ${L} ${BOT}Z" fill="#c94a3a"/>
    <path d="M${R} ${TOP}H${R-14}Q${R-8} ${sy+20} ${R-12} ${sy+30}Q${R-4} ${sy+34} ${R} ${BOT}Z" fill="#c94a3a"/>
    <svg x="25" y="${iy}" width="50" height="50" viewBox="0 0 60 60">${PIC(picOf(d,k))}</svg>
    <g class="spark" style="animation-delay:-${(i*0.53)%3}s"><path d="M${L+12} ${sy-6}l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#fff"/><path d="M${R-10} ${sy+18}l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9z" fill="#fff"/></g>
    <text class="inside-txt" x="50" y="${iy+66}" text-anchor="middle" font-size="15.5">${mix(c.big)}</text>
    <text class="inside-sm" x="50" y="${iy+78}" text-anchor="middle" font-size="${c.sm.length>6?7:8}">${c.sm}</text></g>`;
  const sill=door?`<rect x="6" y="140" width="88" height="6" rx="2" fill="#fff8ec"/>`:
    `<rect x="9" y="117" width="82" height="15" rx="3" fill="#5e3a24"/><rect x="9" y="117" width="82" height="4" fill="#4a2c1a"/><path d="M8 119q3-6 9-3q5-5 11 0q5-5 11 0q5-5 11 0q5-5 11 0q5-5 11 0q5-5 11 0q5-3 9 3z" fill="#fff"/><use href="#holly" x="35" y="122" width="30" height="12"/>`;
  return `<svg viewBox="0 0 100 ${door?148:134}" aria-hidden="true">
    <defs><clipPath id="clip${i}"><path d="${O}"/></clipPath></defs>
    <ellipse class="halo" cx="50" cy="${door?70:60}" rx="58" ry="${door?82:66}" fill="url(#gHalo)"/>
    <path d="${F}" fill="#fff8ec"/>
    <path d="M${L-7} ${sy}A${rad+7} ${rad+7} 0 0 1 ${R+7} ${sy}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    ${inside}
    <path d="${O}" fill="none" stroke="#8a5a3a" stroke-width="2"/>
    <g class="sh l"><path class="body" d="${SL}"/>${pnl(L+5,mid-5)}${heart((L+mid)/2)}</g>
    <g class="sh r"><path class="body" d="${SR}"/>${pnl(mid+5,R-5)}${heart((mid+R)/2)}</g>
    <g class="label">${knob}</g>
    ${wreath}${label}${sill}
    ${st==='today'?ELF(door?140:117,d<='2026-12-25'):''}
  </svg>`;
}
// 屋簷上的小精靈：一隻走來走去會滑倒、翻跟斗；一隻抓著屋簷晃來晃去踢腳
function roofElves(){
  const xm=today<='2026-12-25';
  const walker=ELF(204,xm,{x:36,s:1.15,walk:'eave-walk',flip:'eave-flip',trip:'eave-trip'});
  const cl=xm?'#d9372b':'#f2a2b8';
  const hanger=`<g transform="translate(318 213)"><g class="hang-swing"><g transform="translate(-16.5 39.6) scale(1.1)">${ELF(0,xm,{x:0,walk:'',flip:'',trip:'hang'})}
    <path d="M15.4 -12L15 -34" stroke="${cl}" stroke-width="2.4" stroke-linecap="round"/><circle cx="15" cy="-35.4" r="1.6" fill="#f5d0b0"/>
    <path class="sweat" d="M3 -24q2 3 0 5q-2-2 0-5z" fill="#9fd3f0"/></g></g></g>`;
  document.getElementById('roofElves').innerHTML=walker+hanger;
}
const IO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('off',!e.isIntersecting)),{rootMargin:'80px'}):null;
function render(){roofElves();
  const n=document.getElementById('note');
  if(today<DAYS[0][0]){n.hidden=false;n.textContent='12/15（二）00:00 開第一扇窗，先收藏起來！'}
  else if(today>DAYS[DAYS.length-1][0]){n.hidden=false;n.textContent='倒數結束囉！開過的窗還能回來看折扣碼（用到 2/4）'}
  else n.hidden=true;
  if(IO)IO.disconnect();grid.innerHTML='';
  ORDER.forEach(([d,k],i)=>{
    const st=state(d),door=d==='2027-01-01';
    const b=document.createElement('button');b.type='button';
    b.className=`win ${st}${door?' door':''}`;
    b.setAttribute('aria-label',`${md(d)} ${{today:'今天，點我打開',open:'已打開',future:'還沒到',missed:'錯過了'}[st]}`);
    b.innerHTML=winSVG(d,k,st,i);
    b.addEventListener('click',()=>tap(b,d,k));
    grid.appendChild(b);if(IO)IO.observe(b);
  });
}
function tap(b,d,k){
  const st=state(d);
  if(st==='future')return toast(`${md(d)} 才能開喔，先別偷看`);
  if(st==='missed')return toast('這扇窗錯過了 🥲 明天記得來');
  if(st==='today'){opened[d]=1;save(opened);ga('advent_open',{day:d});b.classList.replace('today','open');setTimeout(()=>sheet(d,k),900);return}
  sheet(d,k);
}
const bg=document.getElementById('sheetBg');
function sheet(d,k){
  const c=C[k];
  sPic.innerHTML=PIC(picOf(d,k));
  sDate.textContent=`${md(d)}（${wd(d)}）的窗`;sTitle.textContent=c.title;sDesc.textContent=c.desc;
  sCodeBox.hidden=!c.code;if(c.code)sCode.textContent=c.code;
  sCta.textContent=c.cta;sCta.href=MODE==='sample'?c.url:withUtm(c.url,d,k);sCta.target=MODE==='sample'?'_blank':'_top';sCta.dataset.d=d;
  sFine.textContent=c.code?'使用期限至 2027/2/4 23:59｜每位會員限用一次｜同類型折扣每筆訂單限用一個':'開運花籤活動至 2026/12/24 23:59';
  bg.hidden=false;requestAnimationFrame(()=>bg.classList.add('show'));sheetX.focus();
}
function closeSheet(){bg.classList.remove('show');setTimeout(()=>bg.hidden=true,300)}
sheetX.onclick=closeSheet;bg.addEventListener('click',e=>{if(e.target===bg)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!bg.hidden)closeSheet()});
function goTop(u){try{if(window.top!==window.self){window.top.location.href=u;return}}catch(e){}location.href=u}
sCta.addEventListener('click',e=>{ga('advent_shop_click',{day:sCta.dataset.d});
  const t=sCode.textContent,has=!sCodeBox.hidden&&t;
  if(has){try{navigator.clipboard.writeText(t).then(()=>toast('已複製 '+t)).catch(()=>{})}catch(err){}}
  if(MODE!=='sample'){e.preventDefault();const u=sCta.href;setTimeout(()=>goTop(u),has?700:0)}
});
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
if(sim){
sim.onchange=()=>{today=sim.value;try{history.replaceState(null,'','#'+today)}catch(e){}render()};
simAll.onclick=()=>{DAYS.forEach(([d])=>opened[d]=1);save(opened);sim.value='2027-01-01';today=sim.value;render();toast('18 扇窗全部打開了')};
simReset.onclick=()=>{opened={};save(opened);render();toast('已清除，全部變回沒開過')};
}
render();
if(MODE==='live'){
  try{fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}).then(r=>{const h=r.headers.get('date');if(h){offset=Date.parse(h)-Date.now();const t=tpe(Date.now()+offset);if(t!==today){today=t;render()}}}).catch(()=>{})}catch(e){}
  setInterval(()=>{const t=tpe(Date.now()+offset);if(t!==today){today=t;render()}},30000);
}

(function(){const cv=document.getElementById('snow'),x=cv.getContext('2d');let W,H,F=[];
  const DPR=Math.min(1.5,devicePixelRatio||1);
  function rs(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR}
  rs();addEventListener('resize',rs);
  for(let i=0;i<45;i++)F.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.4,s:.2+Math.random()*.5,w:Math.random()*6});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  (function f(){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.85)';
    F.forEach(p=>{p.y+=p.s/600;p.w+=.01;if(p.y>1.02){p.y=-.02;p.x=Math.random()}
      x.beginPath();x.arc((p.x+Math.sin(p.w)*.01)*W,p.y*H,p.r*DPR,0,7);x.fill()});
    requestAnimationFrame(f)})();
})();
